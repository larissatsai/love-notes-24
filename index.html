<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Notes for 24</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <h1 class="site-title">Love Notes for 24</h1>
        <p class="site-subtitle">happy birthday to me ✿</p>
      </header>

      <div class="heart-divider" aria-hidden="true">
        <span>✿</span><span>♡</span><span>✿</span>
      </div>

      <section class="about-card" aria-label="About me">
        <div id="about-content">
          <p>Loading…</p>
        </div>
      </section>

      <section class="note-section" aria-label="Get your love note">
        <h2 class="section-heading">What's your name?</h2>
        <p class="section-hint">type it in and i'll show you yours ✿</p>

        <form id="note-form" class="note-form">
          <label for="name-input" class="visually-hidden">Your name</label>
          <input
            id="name-input"
            class="name-input"
            type="text"
            name="name"
            placeholder="e.g. Larissa"
            autocomplete="name"
            required
          />
          <button type="submit" class="reveal-btn">Open my note ♡</button>
        </form>

        <div id="note-reveal" class="note-reveal" aria-live="polite">
          <article class="love-note">
            <p id="note-for" class="note-for"></p>
            <p id="love-note-text" class="love-note-text"></p>
          </article>
        </div>
      </section>

      <footer class="site-footer">
        meow ✿
      </footer>
    </div>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <script src="js/app.js"></script>
  </body>
</html>
